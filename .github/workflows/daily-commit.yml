name: Daily Commit
on:
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:
jobs:
  commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          date >> streak-log.txt
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add streak-log.txt
          git commit -m "Daily commit" || exit 0
          git push
